name: Update data index

on:
  push:
    branches:
      - main
    paths:
      - 'data/**/*.csv'
      - 'data/**/**/*.csv'
      - 'scripts/build-data-index.js'
      - '.github/workflows/update-data-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build data/index.json
        run: node scripts/build-data-index.js
      - name: Commit updated index
        run: |
          if git diff --quiet -- data/index.json; then
            echo "data/index.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json
          git commit -m "Update data index"
          git push
