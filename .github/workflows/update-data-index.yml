name: Update data index

on:
  push:
    branches:
      - main
    paths:
      - "data/**/*.csv"
      - "scripts/build-data-index.js"
      - ".github/workflows/update-data-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build data index
        run: node scripts/build-data-index.js

      - name: Commit updated data index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json
          if git diff --cached --quiet; then
            echo "No changes to data/index.json"
          else
            git commit -m "Update data index"
            git push
          fi
